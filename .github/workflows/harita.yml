# Çevrimdışı harita üretimi (112 İstatistik Merkezi)
# OpenStreetMap verisinden (Protomaps günlük derlemesi) şunları keser ve
# "harita" dalına parçalar halinde yayınlar:
#   - Türkiye geneli: yakınlaştırma 0-11 (il/ilçe adları, ana yollar)
#   - Manisa ve komşu iller (İzmir, Balıkesir, Kütahya, Uşak, Denizli, Aydın): 12-15 (sokak + bina)
# Ayda bir kendiliğinden çalışır; Actions sekmesinden elle de çalıştırılabilir.
name: Çevrimdışı harita

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 5 * *"
  push:
    branches: [main]
    paths: [".github/workflows/harita.yml"]

permissions:
  contents: write

concurrency:
  group: harita
  cancel-in-progress: false

jobs:
  harita:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TR_BBOX: "25.6,35.8,44.9,42.2"
      TR_MAXZOOM: "11"
      BOLGE_BBOX: "26.2,37.3,30.5,40.6"
      BOLGE_MAXZOOM: "15"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: pmtiles aracını kur
        run: |
          gh release download -R protomaps/go-pmtiles -p '*_Linux_x86_64.tar.gz' -O pmtiles.tgz
          tar xzf pmtiles.tgz pmtiles
          ./pmtiles version || true
          pip install --quiet pmtiles

      - name: En güncel derlemeyi bul
        id: kaynak
        run: |
          KEY=$(curl -fsSL https://build-metadata.protomaps.dev/builds.json | python3 -c "import json,sys,re; ks=sorted(e['key'] for e in json.load(sys.stdin) if re.fullmatch(r'\d{8}\.pmtiles', e.get('key',''))); print(ks[-1])")
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Kaynak: https://build.protomaps.com/$KEY"

      - name: Türkiye ve bölgeyi kes
        run: |
          SRC="https://build.protomaps.com/${{ steps.kaynak.outputs.key }}"
          ./pmtiles extract "$SRC" turkiye.pmtiles --bbox="$TR_BBOX" --maxzoom="$TR_MAXZOOM" --download-threads=8
          ./pmtiles extract "$SRC" bolge.pmtiles --bbox="$BOLGE_BBOX" --maxzoom="$BOLGE_MAXZOOM" --download-threads=8
          ls -la *.pmtiles

      - name: Tek dosyada birleştir ve parçala
        env:
          KEY: ${{ steps.kaynak.outputs.key }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib, datetime
          from pmtiles.reader import Reader, MmapSource, all_tiles
          from pmtiles.writer import Writer
          from pmtiles.tile import zxy_to_tileid, TileType, Compression
          trz = int(os.environ["TR_MAXZOOM"])
          def bb(s): return [float(v) for v in s.split(",")]
          tr_bbox, bo_bbox = bb(os.environ["TR_BBOX"]), bb(os.environ["BOLGE_BBOX"])
          tiles = {}
          fa = open("turkiye.pmtiles", "rb"); ra = Reader(MmapSource(fa))
          for (z, x, y), d in all_tiles(ra.get_bytes):
              if z <= trz: tiles[zxy_to_tileid(z, x, y)] = d
          fb = open("bolge.pmtiles", "rb"); rb = Reader(MmapSource(fb))
          for (z, x, y), d in all_tiles(rb.get_bytes):
              if z > trz: tiles[zxy_to_tileid(z, x, y)] = d
          meta = ra.metadata() or {}
          key = os.environ["KEY"]; t = key[:8]
          meta["istatistik_merkezi"] = {
              "kaynak": "https://build.protomaps.com/" + key,
              "veriTarihi": f"{t[6:8]}.{t[4:6]}.{t[0:4]}",
              "bolge": "Türkiye + Manisa ve çevresi (detaylı)",
              "turkiyeMaxZoom": trz, "bolgeMaxZoom": int(os.environ["BOLGE_MAXZOOM"]),
              "turkiyeBbox": tr_bbox, "bolgeBbox": bo_bbox,
              "uretim": datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          e7 = lambda v: int(round(v * 1e7))
          with open("harita.pmtiles", "wb") as f:
              w = Writer(f)
              for tid in sorted(tiles): w.write_tile(tid, tiles[tid])
              w.finalize({"tile_type": TileType.MVT, "tile_compression": Compression.GZIP,
                          "min_zoom": 0, "max_zoom": int(os.environ["BOLGE_MAXZOOM"]),
                          "min_lon_e7": e7(tr_bbox[0]), "min_lat_e7": e7(tr_bbox[1]),
                          "max_lon_e7": e7(tr_bbox[2]), "max_lat_e7": e7(tr_bbox[3]),
                          "center_zoom": 9, "center_lon_e7": e7(27.43), "center_lat_e7": e7(38.61)}, meta)
          os.makedirs("yayin", exist_ok=True)
          size = os.path.getsize("harita.pmtiles"); h = hashlib.sha256(); parts = []; n = 45 * 1024 * 1024
          with open("harita.pmtiles", "rb") as f:
              i = 0
              while True:
                  b = f.read(n)
                  if not b: break
                  h.update(b); name = f"harita.pmtiles.{i:03d}"; open("yayin/" + name, "wb").write(b)
                  parts.append({"ad": name, "boyut": len(b)}); i += 1
          man = {"surum": 1, "boyut": size, "sha256": h.hexdigest(), "parcalar": parts,
                 "parcaSayisi": len(tiles), **{k: meta["istatistik_merkezi"][k] for k in ("veriTarihi", "kaynak", "bolge", "turkiyeMaxZoom", "bolgeMaxZoom", "turkiyeBbox", "bolgeBbox", "uretim")}}
          json.dump(man, open("yayin/manifest.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps({k: man[k] for k in ("boyut", "parcaSayisi", "veriTarihi")}, ensure_ascii=False), len(parts), "parça")
          PY
          ls -la yayin

      - name: harita dalına yayınla
        run: |
          cd yayin
          printf '# Çevrimdışı harita\n\nBu dal otomatik üretilir (.github/workflows/harita.yml). Elle değiştirmeyin.\nVeri: © OpenStreetMap katkıda bulunanlar (ODbL), Protomaps.\n' > README.md
          git init -q -b harita
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Çevrimdışı harita $(python3 -c 'import json;print(json.load(open("manifest.json"))["veriTarihi"])')"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" harita
